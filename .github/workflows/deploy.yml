name: Deploy to Vespa Cloud

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Vespa CLI
        uses: vespa-engine/vespa-management-action/setup-cli@v1

      - name: Deploy Application
        env:
          VESPA_CLI_API_KEY: ${{ secrets.VESPA_CLOUD_KEY }}
        run: |
          vespa config set target cloud
          vespa config set application aria.bot-ai-automatic.default
          vespa deploy src/main/application --wait 300
