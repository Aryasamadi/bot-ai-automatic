name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          debug: true
          script: |
            set -e
            cd /opt/bot-ai-automatic
            git fetch origin main
            git reset --hard origin/main
            /opt/bot-ai-automatic/.venv/bin/pip install -r requirements.txt
            systemctl restart bot-ai-automatic
            systemctl is-active --quiet bot-ai-automatic
