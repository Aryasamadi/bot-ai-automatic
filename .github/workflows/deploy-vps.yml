name: Deploy to VPS

on:
push:
branches:
- main

jobs:
deploy:
runs-on: ubuntu-latest

```
steps:
  - name: Deploy to VPS
    uses: appleboy/ssh-action@v1.2.2
    with:
      host: ${{ secrets.VPS_HOST }}
      username: root
      key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      port: 22
      debug: true
      script: |
        set -e

        echo "=== VPS DEPLOY START ==="

        cd /opt/bot-ai-automatic

        echo "=== FETCH ==="
        git fetch origin main

        echo "=== RESET ==="
        git reset --hard origin/main

        echo "=== INSTALL REQUIREMENTS ==="
        /opt/bot-ai-automatic/.venv/bin/pip install -r requirements.txt

        echo "=== RESTART BOT ==="
        systemctl restart bot-ai-automatic

        echo "=== CHECK SERVICE ==="
        systemctl is-active --quiet bot-ai-automatic

        echo "=== SERVICE STATUS ==="
        systemctl --no-pager --full status bot-ai-automatic

        echo "=== VPS DEPLOY SUCCESS ==="
```
